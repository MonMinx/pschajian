<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Nanobanana Magic</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h3>Nanobanana Magic</h3>

        <div class="section">
            <label for="apiKey">Gemini API Key</label>
            <input type="password" id="apiKey" placeholder="Enter your API Key">
        </div>

        <div class="section">
            <label for="prompt">Prompt (Optional for presets)</label>
            <textarea id="prompt" placeholder="Describe what you want to generate..."></textarea>
        </div>

        <div class="buttons">
            <button id="btnInpaint" class="action-btn">局部重绘 (Inpaint)</button>
            <button id="btnHair" class="action-btn">画头发丝 (Draw Hair)</button>
            <button id="btnRetouch" class="action-btn">产品精修 (Retouch)</button>
        </div>

        <div id="status" class="status">Ready</div>
    </div>
    <script src="main.js"></script>
</body>
</html>
